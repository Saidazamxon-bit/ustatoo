<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FAF6F1" />
<title>Internet aloqasi yo‘q | UstaTop</title>
<link rel="icon" href="/favicon.svg" />
<style>
  :root { --brand: #F47721; --ink: #1F1A17; --muted: #8C827A; --cream: #FAF6F1; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: Urbanist, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    padding-top: max(24px, env(safe-area-inset-top));
  }
  .card { width: 100%; max-width: 380px; text-align: center; animation: up .5s cubic-bezier(.22,1,.36,1) both; }
  .logo { display: inline-flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
  .logo span { color: var(--brand); }
  .orb { position: relative; width: 132px; height: 132px; margin: 36px auto 24px; }
  .orb::before, .orb::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: rgba(244,119,33,.14); animation: pulse 2.4s ease-out infinite; }
  .orb::after { animation-delay: 1.2s; }
  .orb .core { position: absolute; inset: 22px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 30px -14px rgba(84,52,24,.3); }
  h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 24px; line-height: 1.5; font-size: 15px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 52px; padding: 0 28px; border-radius: 999px; border: 0;
    background: var(--brand); color: #fff; font: inherit; font-weight: 700; font-size: 16px; cursor: pointer;
    box-shadow: 0 10px 24px -8px rgba(244,119,33,.55); transition: transform .15s ease; width: 100%; }
  .btn:active { transform: scale(.97); }
  .ghost { margin-top: 12px; background: #fff; color: var(--ink); box-shadow: 0 10px 30px -14px rgba(84,52,24,.18); text-decoration: none; }
  .hint { margin-top: 20px; font-size: 13px; color: var(--muted); }
  @keyframes pulse { from { transform: scale(.7); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
</style>
</head>
<body>
  <main class="card">
    <div class="logo">
      <svg width="34" height="34" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="12" fill="#F47721"/><path d="M10 24.5c0-6.2 4.5-11 10-11s10 4.8 10 11" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M20 13.5v5" stroke="#fff" stroke-width="3" stroke-linecap="round"/><rect x="7.5" y="24" width="25" height="4.2" rx="2.1" fill="#fff"/></svg>
      Usta<span>Top</span>
    </div>
    <div class="orb" aria-hidden="true">
      <div class="core">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F47721" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.64"/><path d="M2 8.82a15 15 0 0 1 4.17-2.65"/><path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"/><path d="m2 2 20 20"/></svg>
      </div>
    </div>
    <h1>Internet aloqasi yo‘q</h1>
    <p>Bu sahifa hali qurilmangizda saqlanmagan. Internet qaytgach, UstaTop avtomatik ravishda davom etadi. Ma’lumotlaringiz xavfsiz saqlanadi.</p>
    <button class="btn" onclick="location.reload()">Qayta urinish</button>
    <a class="btn ghost" href="/">Bosh sahifa</a>
    <p class="hint" id="status">Ulanish kutilmoqda…</p>
  </main>
  <script>
    // Internet qaytishi bilan sahifani avtomatik qayta yuklash
    window.addEventListener("online", function () {
      document.getElementById("status").textContent = "Internet qaytdi — yuklanmoqda…";
      setTimeout(function () { location.reload(); }, 600);
    });
  </script>
</body>
</html>
